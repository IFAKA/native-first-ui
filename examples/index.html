<!doctype html>
<html lang="en">
 <head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <meta name="description" content="Reusable native HTML interface patterns built with Native-First UI." />
 <title>Native-First UI — reusable HTML patterns</title>
 <link rel="stylesheet" href="../dist/core.css" />
 </head>
 <body>
 <header class="nf-container nf-page-header">
 <a href="/">Native-First UI</a>
 <div class="nf-cluster nf-header-actions">
 <button class="nf-command-trigger" type="button" commandfor="component-command" command="show-modal" aria-haspopup="dialog">
 <span>Find a component</span>
 <kbd aria-label="Command K">⌘ K</kbd>
 </button>
 <label class="nf-toggle">
 <input type="checkbox" data-nf-theme-toggle />
 <span class="nf-toggle-control" aria-hidden="true"></span>
 <span>Dark mode</span>
 </label>
 </div>
 </header>

 <main class="nf-page">
 <dialog id="component-command" class="nf-command-dialog" aria-labelledby="component-command-title">
 <form method="dialog" class="nf-stack" data-nf-command-palette>
 <div class="nf-split">
 <h2 id="component-command-title">Find a component</h2>
 <button type="submit" data-variant="quiet">Close</button>
 </div>
 <label class="nf-sr-only" for="component-search">Search components</label>
 <input id="component-search" type="search" placeholder="Search components…" autocomplete="off" data-nf-command-input />
 <div id="component-command-results" class="nf-command-results" role="listbox" aria-label="Components"></div>
 <p class="nf-help">Use ↑ ↓ to move, Enter to open, Esc to close.</p>
 </form>
 </dialog>

 <div class="nf-container nf-sidebar">
 <nav aria-label="Components">
 <h2>Components</h2>
 <div class="nf-navigation nf-component-index" id="component-index" aria-label="All components"></div>
 <p class="nf-help" id="catalog-empty" hidden>No matching components.</p>
 </nav>

 <section class="nf-content nf-stack" aria-labelledby="example-title">
 <section class="nf-card nf-stack">
 <header class="nf-split">
 <div class="nf-stack" data-gap="sm">
 <h2 id="example-title">Actions</h2>
 <p class="nf-help" id="example-contract">components</p>
 </div>
 <button id="copy-code" type="button">Copy HTML</button>
 </header>
 <div id="preview" class="nf-stack"></div>
 <details>
 <summary>View HTML</summary>
 <pre id="code"  tabindex="0"><code></code></pre>
 </details>
 </section>

 <section class="nf-grid">
 <article class="nf-card nf-stack" data-gap="sm">
 <h2>When to use it</h2>
 <p id="when-to-use"></p>
 </article>
 <article class="nf-card nf-stack" data-gap="sm">
 <h2>Accessibility contract</h2>
 <ul id="a11y-notes"></ul>
 </article>
 </section>

 <p id="status" role="status" aria-live="polite"></p>
 </section>
 </div>
 </main>

 };

 function render(name = current, componentTitle = currentComponent, componentSlug = "") {

 async function loadComponents() {
 try {
 const [catalogResponse, exampleResponse, nativeDemoResponse] = await Promise.all([fetch("../recipes/catalog.json"), fetch("../recipes/component-examples.json"), fetch("../recipes/native-demos.json")]);
 const catalogData = await catalogResponse.json();

 componentIndex.innerHTML = availableComponents.map(markupFor).join("");

 if (selected) { const button = componentIndex.querySelector(`[data-search-name^="${selected} "]`); render(button.dataset.component, button.dataset.componentName, selected); if (!requested) history.replaceState(null, "", `#${selected}`); }

 const filterComponents = () => { const query = searchInput.value.trim().toLowerCase(); const buttons = [...document.querySelectorAll("#component-index button"), ...document.querySelectorAll("#component-command-results button")]; buttons.forEach((button) => { button.hidden = query.length > 0 && !button.dataset.searchName.toLowerCase().includes(query); }); document.querySelector("#catalog-empty").hidden = [...document.querySelectorAll("#component-index button")].every((button) => button.hidden); };
