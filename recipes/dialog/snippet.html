<button type="button" commandfor="confirm-dialog" command="show-modal">Open dialog</button>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog" class="nf-stack">
    <h2 id="confirm-title">Confirm action</h2>
    <p>This action can be cancelled before it is submitted.</p>
    <div class="nf-cluster"><button value="cancel">Cancel</button><button data-variant="primary" value="confirm">Confirm</button></div>
  </form>
</dialog>
